name: Foundation quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SENTINEL_E2E_ARTIFACTS_ROOT: ${{ runner.temp }}/sentinel-landing-web-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser:list
      - run: npm run test:browser
      - name: Dependency audit
        run: npm audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-browser-evidence
          path: ${{ runner.temp }}/sentinel-landing-web-qa
          if-no-files-found: ignore
